<svg xmlns="http://www.w3.org/2000/svg" width="688" height="270" viewBox="0 0 688 270" role="img"
     aria-label="A cream paper glider tows a big manila cargo tag reading: Assigned to you, PROJ-142: Fix login redirect. Tagline: It flies across your screen when Jira needs you.">
  <!-- Baked from the product's own geometry and palette (plane.html):
       the three glider faces are the wing/keel clip-paths projected through
       the flight rig's fold (rotateX ±80), bank attitude (w=0.25) and 900px
       perspective; the rope runs tail anchor to tag grommet like the pendulum
       sim's does. Proportions per the owner's real capture 2026-08-05: the
       tag is big relative to the plane. Not AI art. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f1"/>
      <stop offset="1" stop-color="#f4efdf"/>
    </linearGradient>
    <linearGradient id="manila" x1="0" y1="0" x2="1" y2="0.27">
      <stop offset="0" stop-color="#eddfb4"/>
      <stop offset="0.7" stop-color="#e2d2a2"/>
      <stop offset="1" stop-color="#d6c592"/>
    </linearGradient>
    <filter id="tagshadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="10" dy="14" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tagclip">
      <polygon points="0,0 318,0 340,35 318,70 0,70"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="688" height="270" rx="6" fill="url(#sky)"/>

  <g transform="translate(24,44)">
    <!-- glider: the B2 wide cream glider's three faces, far wing then keel
         then near wing (the sim's painter order) -->
    <g transform="translate(450,-4)">
      <g fill="#cfc5a5" opacity="0.55">
        <rect x="-130" y="38" width="110" height="3" rx="1.5"/>
        <rect x="-114" y="47" width="82"  height="3" rx="1.5"/>
        <rect x="-124" y="55" width="96"  height="3" rx="1.5"/>
      </g>
      <polygon points="171.0,46.1 9.7,55.0 1.2,57.6"   fill="#f5efdd"/>
      <polygon points="170.9,45.1 1.1,56.6 52.7,71.0"  fill="#b3a683"/>
      <polygon points="171.0,46.1 -10.0,35.1 1.2,57.6" fill="#d8cdae"/>
    </g>

    <!-- rope, bowing slack: tail anchor to the tag's grommet -->
    <path d="M449.9,47.7 Q404,88 357.8,84.9" fill="none" stroke="#cfc5a5" stroke-width="2.5" stroke-linecap="round"/>

    <!-- the cargo tag: ruled manila, marker handwriting, grommet -->
    <g transform="translate(34,58) rotate(-3 170 35)" filter="url(#tagshadow)">
      <polygon points="0,0 318,0 340,35 318,70 0,70" fill="url(#manila)"/>
      <g clip-path="url(#tagclip)" stroke="#8c7850" stroke-opacity="0.35" stroke-width="1">
        <line x1="0" y1="21.5" x2="340" y2="21.5"/>
        <line x1="0" y1="43.5" x2="340" y2="43.5"/>
        <line x1="0" y1="65.5" x2="340" y2="65.5"/>
      </g>
      <g font-family="'Marker Felt','Bradley Hand','Comic Sans MS',cursive" font-size="16" fill="#3a3226">
        <text x="16" y="28">Assigned to you &#8212; PROJ-142:</text>
        <text x="16" y="50">Fix login redirect</text>
      </g>
      <circle cx="324" cy="35" r="7"   fill="#8b8d94"/>
      <circle cx="324" cy="35" r="5.5" fill="#d8dbe0"/>
      <circle cx="324" cy="35" r="3.5" fill="#2c3444"/>
    </g>
  </g>

  <!-- tagline -->
  <text x="344" y="252" text-anchor="middle"
        font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#6b5f45">It flies across your screen when Jira needs you</text>
</svg>
