<!DOCTYPE html>
<html>
<!--
  jiraPlane overlay — ALL visuals live in this one self-contained file.
  Event data arrives via query string: ?type=assigned|mention|comment|digest&issueKey=...&snippet=...
  (digest has no label — the banner is just the snippet, e.g. "7 Jira updates")
  Multi-display (#6): main.js opens one of these windows per display and adds
  start (shared wall-clock ms), dur (ms), minX/maxX/flyY (global desktop px)
  and audio (leftmost window only); each window renders its slice of one
  continuous flight. Without those params it's a single-screen 10s flight
  (standalone browser previews). main.js destroys the windows 1s after the
  animation ends.
  Design: B2 paper glider — spec 2026-08-01-jiraplane-ui-redesign-design.md.
  Banner: cargo tag towed on a rigid-rope pendulum sim, accepted in #4
  (weight 670, drag 5.0, rope 64). Accepted values come from the spec prototype
  and the #4 round-2 comment; don't re-derive them.
  Skywriter (#10): optional second style, ?banner=skywriter — smoke letters
  written along the flight path (as-is port of design-directions round 1);
  tag + rope hidden, pendulum sim skipped. main.js adds textX0/textX1
  (global px text bounds). Default/unknown banner value = cargo.
-->
<head>
<meta charset="utf-8">
<style>
  :root { --fly-duration: 10s; }
  html, body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    /* No pointer-events:none here: click-through is governed by
       setIgnoreMouseEvents in main.js, and forwarded mousemove (#9) must
       hit-test against the page to reach our window-level listeners. */
  }

  /* Flight rig: move (x) > swoop (sine y) > bank (3D attitude, plane only).
     Banner rides on swoop, NOT bank, so it stays level and readable.
     #11: the move/swoop/bank keyframes are replaced by the per-frame JS
     flight sim below; streaks/twist/puff still run on CSS with --sync-delay. */
  .move {
    position: fixed;
    top: 32vh;
    left: 0;
  }

  .swoop {
    display: flex;
    align-items: center;
    gap: 6px;
    perspective: 900px;
  }

  .bank {
    transform-style: preserve-3d;
  }

  /* B2 wide cream glider: 3 faces, spine (fold line) at y=52 in model space */
  .model { position: relative; width: 170px; height: 80px; transform-style: preserve-3d; }
  .face  { position: absolute; left: 0; width: 170px; }
  .wing  {
    top: -26px; height: 78px;
    transform-origin: bottom;
    clip-path: polygon(100% 100%, 0% 12%, 0% 100%);
  }
  .far  { background: #f5efdd; transform: rotateX(80deg); }
  .near { background: #d8cdae; transform: rotateX(-80deg); }
  .keel {
    top: 51px; height: 18px;
    background: #b3a683;
    clip-path: polygon(100% 0%, 0% 0%, 30% 100%);
  }

  /* Air: tapered cartoon speed-lines shearing off the trailing edge.
     They live inside .bank so the wake tilts with the plane. */
  .air { position: absolute; top: 0; left: 0; }
  .streak {
    position: absolute;
    transform-origin: right center;
    opacity: 0;
    animation: streak .8s linear infinite;
    animation-play-state: paused;
    overflow: visible;
  }
  body.fly .streak { animation-play-state: running; }
  /* standalone rotate: composes with the animated transform (transform: rotate() would be overwritten)
     s1/s3 viewBoxes are wider than their width attrs, so those streaks render
     ~73% scale — deliberate, this is the accepted look (#4 cleanup note) */
  .streak.s1 { left: -120px; top: 10px; animation-delay: var(--sync-delay, 0s); rotate: -3deg; }
  .streak.s2 { left: -100px; top: 30px; animation-delay: calc(.3s + var(--sync-delay, 0s));  animation-duration: .95s; }
  .streak.s3 { left: -105px; top: 46px; animation-delay: calc(.55s + var(--sync-delay, 0s)); animation-duration: .75s; rotate: 2deg; }
  .streak.s4 { left: -78px;  top: 62px; animation-delay: calc(.15s + var(--sync-delay, 0s)); animation-duration: .7s;  rotate: 4deg; }
  .streak.s5 { left: -120px; top: 72px; animation-delay: calc(.45s + var(--sync-delay, 0s)); animation-duration: .9s;  rotate: -2deg; }
  @keyframes streak {
    0%   { opacity: 0;  transform: translateX(20px) scaleX(.3); }
    18%  { opacity: 1; }
    55%  { opacity: .55; }
    100% { opacity: 0;  transform: translateX(-60px) scaleX(1.4); }
  }

  /* Tow anchor: invisible marker at the glider's tail; JS reads its real
     screen position every frame (it rides move + swoop + bank) */
  .anchor { position: absolute; left: -2px; top: 45px; width: 2px; height: 2px; }

  /* Cargo-tag banner: tag + rope live OUTSIDE the flight rig, driven per-frame
     by the pendulum simulation. Rope endpoints are the real anchor + grommet. */
  #ropesvg { position: fixed; inset: 0; width: 100%; height: 100%;
             pointer-events: none; visibility: hidden; }
  body.fly #ropesvg, body.fly #tag { visibility: visible; }
  #ropesvg path { fill: none; stroke: rgba(240,240,230,.7); stroke-width: 2.5;
                  stroke-linecap: round; }
  #tag { position: fixed; left: 0; top: 0; pointer-events: none;
         visibility: hidden;
         perspective: 800px;
         filter: drop-shadow(10px 14px 16px rgba(0,0,0,.45));
         transform-origin: calc(100% - 16px) 50%; /* pivot at the grommet */
         will-change: transform;
         transition: filter .15s; }
  /* Hover affordance (#9): macOS won't show a CSS pointer cursor for this
     never-activated overlay window, so the tag itself signals clickability —
     it lifts toward the viewer while the cursor is inside the hitbox. */
  #tag.hot { filter: drop-shadow(14px 20px 22px rgba(0,0,0,.55)); }
  #tag .slab { transition: scale .15s; }
  #tag.hot .slab { scale: 1.07; }
  .slab {
    position: relative; transform-style: preserve-3d;
    animation: twist 7.5s ease-in-out var(--sync-delay, 0s) infinite alternate;
    animation-play-state: paused;
  }
  body.fly .slab { animation-play-state: running; }
  @keyframes twist { /* slow twist on the rope; edge catches the light */
    from { transform: rotateX(5deg) rotateY(-11deg); }
    to   { transform: rotateX(5deg) rotateY(-21deg); }
  }
  .tagshape {
    clip-path: polygon(0% 0%, calc(100% - 22px) 0%, 100% 50%,
                       calc(100% - 22px) 100%, 0% 100%);
  }
  .ply { position: absolute; inset: 0; }
  .ply.p1 { transform: translateZ(-5px);  background: #cbba8e; }
  .ply.p2 { transform: translateZ(-10px); background: #ab9a72; }
  .paper {
    position: relative;
    max-width: 260px;
    padding: 12px 36px 14px 16px;
    background-image:
      repeating-linear-gradient(transparent 0 21px, rgba(140,120,80,.35) 21px 22px),
      linear-gradient(105deg, #eddfb4, #e2d2a2 70%, #d6c592);
    font: 400 16px/22px 'Marker Felt', 'Bradley Hand', 'Comic Sans MS', cursive;
    color: #3a3226;
    transform: translateZ(0);
  }
  .paper::after { /* metal grommet in the tag point */
    content: ''; position: absolute; right: 9px; top: 50%; margin-top: -7px;
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      #2c3444 0 3.5px, #d8dbe0 3.5px 5.5px, #8b8d94 5.5px 7px);
    box-shadow: 0 1px 1px rgba(0,0,0,.35);
  }

  /* Skywriter (#10): letters condense as smoke in world space at the moment
     the plane's tail passes them, then drift up and dissipate. Per-puff
     position, delay and duration are set inline by JS; duration is the
     REMAINING flight time so nothing pops off mid-fade at teardown. */
  body.skywriter #ropesvg, body.skywriter #tag { display: none; }
  .puff {
    position: fixed;
    opacity: 0;
    font: 800 24px 'Arial Rounded MT Bold', -apple-system, sans-serif;
    color: #f2f6ff;
    text-shadow: 0 0 10px rgba(240,246,255,.95),
                 0 0 26px rgba(240,246,255,.55),
                 0 0 44px rgba(240,246,255,.3);
    animation: puff 10s linear both;
    animation-play-state: paused;
    will-change: transform, opacity, filter;
  }
  body.fly .puff { animation-play-state: running; }
  @keyframes puff {
    0%   { opacity: 0;   transform: scale(.4) translateY(6px);    filter: blur(8px); }
    3%   { opacity: .95; transform: scale(1) translateY(0);       filter: blur(.5px); }
    45%  { opacity: .55; transform: scale(1.12) translateY(-9px); filter: blur(2.5px); }
    80%  { opacity: 0;   transform: scale(1.3) translateY(-20px); filter: blur(6px); }
    100% { opacity: 0;   transform: scale(1.3) translateY(-20px); filter: blur(6px); }
  }
</style>
</head>
<body>
  <svg id="ropesvg"><path id="rope"/></svg>

  <div id="tag">
    <div class="slab">
      <div class="ply p2 tagshape"></div>
      <div class="ply p1 tagshape"></div>
      <div class="paper tagshape">
        <span id="banner"></span>
      </div>
    </div>
  </div>

  <div id="sky"></div>

  <div class="move">
    <div class="swoop">
      <div class="bank">
        <div class="model">
          <div class="face wing far"></div>
          <div class="face wing near"></div>
          <div class="face keel"></div>
          <div class="anchor" id="anchor"></div>
          <div class="air">
            <svg class="streak s1" width="110" height="10" viewBox="0 0 150 10">
              <path d="M150,2 C95,0.5 45,2 0,5 C45,6.5 95,8.8 150,8.2 Z" fill="rgba(236,241,255,.7)"/>
            </svg>
            <svg class="streak s2" width="90" height="8" viewBox="0 0 90 8">
              <path d="M90,1.8 C58,0.6 28,1.6 0,4 C28,5.4 58,7 90,6.4 Z" fill="rgba(236,241,255,.38)"/>
            </svg>
            <svg class="streak s3" width="95" height="10" viewBox="0 0 130 10">
              <path d="M130,2 C84,0.5 40,2 0,5 C40,6.5 84,8.8 130,8.2 Z" fill="rgba(236,241,255,.65)"/>
            </svg>
            <svg class="streak s4" width="68" height="6" viewBox="0 0 68 6">
              <path d="M68,1.4 C44,0.5 20,1.2 0,3 C20,4.2 44,5.2 68,4.8 Z" fill="rgba(236,241,255,.32)"/>
            </svg>
            <svg class="streak s5" width="112" height="8" viewBox="0 0 112 8">
              <path d="M112,1.6 C72,0.5 34,1.5 0,4 C34,5.6 72,7.2 112,6.6 Z" fill="rgba(236,241,255,.5)"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const labels = {
      assigned: 'Assigned to you',
      mention: 'You were mentioned',
      comment: 'New comment',
      digest: '', // banner is just the snippet ("7 Jira updates")
    };
    const label = labels[params.get('type')] ?? 'Jira update';
    const issueKey = params.get('issueKey') || '';
    const snippet = params.get('snippet') || '';
    const parts = [label, issueKey && snippet ? issueKey + ': ' + snippet : issueKey || snippet];
    document.getElementById('banner').textContent = parts.filter(Boolean).join(' — ');

    // Banner style (#10): default and unknown values mean cargo.
    const bannerStyle = params.get('banner') === 'skywriter' ? 'skywriter' : 'cargo';
    if (bannerStyle === 'skywriter') document.body.classList.add('skywriter');

    // Multi-display flight (#6): main.js passes a shared wall-clock start plus
    // the global span; this window renders its slice, mapping desktop coords
    // to local via window.screenX/screenY. Standalone (no params): fly now.
    const moveEl = document.querySelector('.move');
    const startAt = +params.get('start') || Date.now();
    if (params.has('dur')) {
      document.documentElement.style.setProperty(
        '--fly-duration', +params.get('dur') / 1000 + 's');
    }

    // ===== flight sim (#11): motion is a pure function of flight-time s =====
    const swoopEl = document.querySelector('.swoop');
    const bankEl  = document.querySelector('.bank');
    const durS = params.has('dur') ? +params.get('dur') / 1000 : 10;
    const multi = params.has('minX');
    const ox = () => (multi ? window.screenX : 0);   // global → local, per frame
    const oy = () => (multi ? window.screenY : 0);
    // course endpoints in global px — same numbers the old --sx/--ex computed
    const fromX = (multi ? +params.get('minX') : 0) - 1.1 * moveEl.offsetWidth;
    const toX   = (multi ? +params.get('maxX') : innerWidth) + 400;
    const lineY = multi ? +params.get('flyY') : innerHeight * 0.32;

    function courseX(s) { return fromX + (s / durS) * (toX - fromX); }
    function swoopY(s)  { return 44 * Math.cos(2 * Math.PI * s / (durS / 2)); }
    function attitude(s) {
      const w = Math.sin(2 * Math.PI * s / (durS / 2));
      return { z: -14 * w, x: 5 + 16 * w, y: -10 * w };
    }

    // flight clock: freezes while held (#11 owner decision), pause shifts the schedule
    let pausedMs = 0, heldSince = null;
    function flightS() {
      const t = heldSince ?? Date.now();
      return Math.min(durS, Math.max(0, (t - startAt - pausedMs) / 1000));
    }

    // deviation from course: (0,0) in clean flight; cursor-driven while held;
    // spring-recovered after release.
    let mode = 'course';                       // 'course' | 'drag' | 'recover'
    let off = { x: 0, y: 0 }, offV = { x: 0, y: 0 };
    let target = { x: 0, y: 0 };               // recovery target for off
    // Recovery spring: owner's Round-1 picks from the #11 prototype, judged by
    // feel like the pendulum's G/C/L — don't re-derive.
    const K = 55, D = 10;                      // stiffness 1/s², damping 1/s
    let grabOff = { x: 0, y: 0 };              // cursor→rig offset, set at grab
    const cursorG = () => ({ x: cursor.x + ox(), y: cursor.y + oy() });

    function renderRig(gx, gyLine, sy, att) {  // global rig origin + swoop + attitude
      moveEl.style.top = gyLine - oy() + 'px';
      moveEl.style.transform = `translateX(${gx - ox()}px)`;
      swoopEl.style.transform = `translateY(${sy}px)`;
      bankEl.style.transform =
        `rotateZ(${att.z}deg) rotateX(${att.x}deg) rotateY(${att.y}deg)`;
    }

    function stepFlight(dt) {
      const s = flightS();
      if (mode === 'drag') {
        off.x = (cursorG().x + grabOff.x) - courseX(s);
        off.y = (cursorG().y + grabOff.y) - lineY;
      } else if (mode === 'recover') {
        offV.x += (-K * (off.x - target.x) - D * offV.x) * dt;
        offV.y += (-K * (off.y - target.y) - D * offV.y) * dt;
        off.x += offV.x * dt; off.y += offV.y * dt;
        // REJOIN_EPS = 1 (px, px/s): snap threshold, a guess — invisible at that scale
        if (Math.hypot(off.x - target.x, off.y - target.y) < 1 &&
            Math.hypot(offV.x, offV.y) < 1) {
          off = { ...target }; offV = { x: 0, y: 0 }; mode = 'course';
        }
      }
      renderRig(courseX(s) + off.x, lineY + off.y, swoopY(s), attitude(s));
    }

    function launch() {
      // --sx/--ex are gone (#11): the sim's fromX/toX carry the course now
      const root = document.documentElement.style;
      root.setProperty('--sync-delay', startAt - Date.now() + 'ms');
      if (bannerStyle === 'skywriter') layoutSkywriter();
      document.body.classList.add('fly');
      if (params.get('audio') !== '0') startAudio();
    }
    setTimeout(launch, Math.max(0, startAt - Date.now()));

    // Airy whoosh: noise -> bandpass -> gain envelope -> stereo pan across the room.
    // Entirely optional: any failure is swallowed so audio can never break the
    // visual. Multi-display flights play it in the leftmost window only.
    function startAudio() {
      try {
        const durS = parseFloat(
          getComputedStyle(document.documentElement).getPropertyValue('--fly-duration')
        ) || 10;
        const ctx = new AudioContext();
        const buf = ctx.createBuffer(1, 2 * ctx.sampleRate, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.Q.value = 0.6;
        const gain = ctx.createGain();
        gain.gain.value = 0;
        const pan = new StereoPannerNode(ctx);
        src.connect(bp); bp.connect(gain); gain.connect(pan); pan.connect(ctx.destination);
        const t = ctx.currentTime;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.28, t + 0.39 * durS);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.67 * durS);
        gain.gain.linearRampToValueAtTime(0, t + 0.96 * durS);
        pan.pan.setValueAtTime(-0.9, t);
        pan.pan.linearRampToValueAtTime(0.9, t + durS);
        bp.frequency.setValueAtTime(420, t);
        bp.frequency.linearRampToValueAtTime(750, t + 0.5 * durS);
        bp.frequency.linearRampToValueAtTime(380, t + durS);
        src.start();
      } catch (e) { /* silence is fine */ }
    }

    /* ===== skywriter (#10, as-is port of design-directions round 1) =====
       Each letter is a fixed-position puff laid down at the point — and the
       moment — the plane's tail crosses its x. Multi-display: all coords are
       computed in global desktop px, converted to this window's local px once
       at launch; puffs outside the window simply clip. */
    function layoutSkywriter() {
      const text = document.getElementById('banner').textContent;
      const sky = document.getElementById('sky');
      const durS = params.has('dur') ? +params.get('dur') / 1000 : 10;
      const multi = params.has('minX');
      const ox = multi ? window.screenX : 0; // global → local offset
      const oy = multi ? window.screenY : 0;
      // Plane-tail x span, mirroring the move animation: -110% rig entry, +400px exit
      const from = (multi ? +params.get('minX') : 0) - 1.1 * moveEl.offsetWidth;
      const to = (multi ? +params.get('maxX') : innerWidth) + 400;
      // Text bounds: 6%–88% of the primary display (multi) or the viewport (standalone)
      const x0 = multi ? +params.get('textX0') : innerWidth * 0.06;
      const x1 = multi ? +params.get('textX1') : innerWidth * 0.88;
      const baseY = (multi ? +params.get('flyY') : innerHeight * 0.32) + 40;
      const spacing = Math.min(26, (x1 - x0) / text.length);
      [...text].forEach((c, i) => {
        if (c === ' ') return; // spacing already reserves the slot
        const x = x0 + i * spacing;
        const t = ((x - from) / (to - from)) * durS; // moment the tail crosses x
        const y = baseY + 44 * Math.cos((2 * Math.PI * t) / (durS / 2)); // swoop sine
        const s = document.createElement('span');
        s.className = 'puff';
        s.textContent = c;
        s.style.left = x - ox + 'px';
        s.style.top = y - oy + 'px';
        s.style.animationDelay = `calc(var(--sync-delay, 0s) + ${t}s)`;
        // Compress the keyframe shape into the remaining flight time: early
        // letters linger (prototype feel), late letters dissipate quicker.
        s.style.animationDuration = durS - t + 's';
        sky.appendChild(s);
      });
    }

    /* ===== cargo-tag pendulum (accepted in #4) =====
       The grommet is a mass under gravity + air drag, tied to the tow anchor
       by a rigid-length rope: a distance constraint that stops stretch but
       allows slack. Trail angle, pendulum swing on climbs/dives, and the
       settle all emerge from the G/C balance. The tag also weathervanes —
       its long axis aligns with its own apparent airflow (±6° clamp). */
    const anchorEl = document.getElementById('anchor');
    const tagEl    = document.getElementById('tag');
    const ropeEl   = document.getElementById('rope');
    const GROMMET_INSET = 16;      // grommet center from tag's right edge
    const G = 670, C = 5, L = 64;  // accepted feel: gravity px/s², drag 1/s, rope px
    let pos = null, vel = { x: 0, y: 0 }, pAnchor = null, pitch = 0;
    let last = performance.now();

    /* ===== clickable tag (#9) =====
       Browsers recompute hover only on real mouse movement, so a tag sliding
       out from under a stationary cursor never fires mouseleave. The hot/cold
       state is therefore driven by a per-frame hit-test in the sim loop:
       last-known cursor (window mousemove — forwarded while click-through,
       real while armed) vs. the tag's current rect + HIT_PAD. */
    const ticketUrl = params.get('url') || '';
    const clickable = !!ticketUrl && bannerStyle === 'cargo' && !!window.jiraPlane;
    const HIT_PAD = 24; // generous hitbox, owner option (a) — a guess; tune by feel
    let cursor = null, hot = false;
    if (clickable) {
      addEventListener('mousemove', (e) => { cursor = { x: e.clientX, y: e.clientY }; });
      addEventListener('click', () => { if (hot) window.jiraPlane.openTicket(); });
    }
    function updateHot() {
      if (!clickable) return;
      const r = tagEl.getBoundingClientRect();
      const inside = !!cursor && document.body.classList.contains('fly') &&
        cursor.x > r.left - HIT_PAD && cursor.x < r.right + HIT_PAD &&
        cursor.y > r.top - HIT_PAD && cursor.y < r.bottom + HIT_PAD;
      if (inside !== hot) {
        hot = inside;
        window.jiraPlane.setTagHot(hot);
        document.documentElement.style.cursor = hot ? 'pointer' : '';
        tagEl.classList.toggle('hot', hot);
      }
    }

    // #11: one loop for both banner styles. stepFlight moves the rig (and
    // re-pins top every frame — macOS nudges overlay windows below the menu
    // bar by differing per-display amounts, and AeroSpace can shift frames
    // mid-flight, #6); the pendulum + hit-test only exist for the cargo tag.
    function frame(now) {
      const dt = Math.min((now - last) / 1000, .032); last = now;
      stepFlight(dt);
      if (bannerStyle === 'cargo') stepPendulum(dt);
      requestAnimationFrame(frame);
    }

    function stepPendulum(dt) {
      const a  = anchorEl.getBoundingClientRect();
      const ax = a.left + a.width / 2, ay = a.top + a.height / 2;

      // first frame (or a big stall teleported the anchor): reset the tag near it
      if (!pos || !pAnchor || Math.hypot(ax - pAnchor.x, ay - pAnchor.y) > 250) {
        pos = { x: ax - L * .7, y: ay + L * .7 };
        vel.x = 0; vel.y = 0; pAnchor = { x: ax, y: ay };
      }
      const avx = (ax - pAnchor.x) / dt, avy = (ay - pAnchor.y) / dt;
      pAnchor = { x: ax, y: ay };

      // gravity + air drag (air is still in screen space)
      vel.y += G * dt;
      const f = Math.exp(-C * dt);
      vel.x *= f; vel.y *= f;
      pos.x += vel.x * dt; pos.y += vel.y * dt;

      // rigid rope: clamp distance, kill outward radial velocity (rel. anchor)
      let dx = pos.x - ax, dy = pos.y - ay, d = Math.hypot(dx, dy);
      if (d > L) {
        const ux = dx / d, uy = dy / d;
        pos.x = ax + ux * L; pos.y = ay + uy * L;
        const rad = (vel.x - avx) * ux + (vel.y - avy) * uy;
        if (rad > 0) { vel.x -= rad * ux; vel.y -= rad * uy; }
        d = L;
      }

      // rope: straight when taut, bows down when slack
      const sag = Math.max(0, L - d) * .8 + 2;
      const mx = (ax + pos.x) / 2, my = (ay + pos.y) / 2 + sag;
      ropeEl.setAttribute('d', `M${ax},${ay} Q${mx},${my} ${pos.x},${pos.y}`);

      // weathervane: tail aligns with apparent airflow (smoothed, clamped)
      const speed = Math.hypot(vel.x, vel.y);
      if (speed > 40) {
        let t = (Math.atan2(-vel.y, -vel.x) - Math.PI) * 180 / Math.PI;
        while (t > 180) t -= 360; while (t < -180) t += 360;
        t = Math.max(-6, Math.min(6, t));
        pitch += (t - pitch) * Math.min(1, 6 * dt);
      }

      const w = tagEl.offsetWidth, h = tagEl.offsetHeight;
      tagEl.style.transform =
        `translate(${pos.x - (w - GROMMET_INSET)}px, ${pos.y - h / 2}px) rotate(${pitch}deg)`;
      updateHot();
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
